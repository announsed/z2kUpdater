name: Entware offline installers
# Офлайн-установщики Entware для Keenetic (aarch64, mipsel, mips).
#
# Зачем: официальный установщик сам качает базовые пакеты с bin.entware.net, а у
# части провайдеров этот сервер обрывает загрузку по объёму — установка Entware
# умирает. Здесь берётся ОФИЦИАЛЬНЫЙ установщик, и в него кладутся его же
# базовые пакеты плюс curl с проверкой SHA256 по официальному индексу
# (scripts/entware_offline_build.sh). Каждый архив ставится без сети в chroot
# через qemu (scripts/entware_offline_smoke.sh) — не встал, не публикуем.
#
# Когда что делает:
#   по понедельникам и вручную на z2k-enhanced — собрать, проверить и, если
#     состав пакетов изменился, обновить файлы в релизе entware-offline;
#   на пуш в z2k-staging с правкой сборщика — только собрать и проверить.
on:
  schedule:
    # Понедельник 03:23 UTC — минута не :00, чтобы не толкаться в толпе cron'ов.
    - cron: "23 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - z2k-staging
    paths:
      - scripts/entware_offline_build.sh
      - scripts/entware_offline_smoke.sh
      - .github/workflows/entware-offline.yml
permissions:
  contents: read
concurrency:
  group: entware-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build, offline install, publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: entware-offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: qemu for the offline install check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: build
        run: |
          set -eu
          mkdir -p out
          for a in aarch64 mipsel mips; do sh scripts/entware_offline_build.sh "$a" out; done
          ls -l out
      - name: offline install (no network)
        run: |
          set -eu
          for f in out/*-installer.tar.gz; do sudo sh scripts/entware_offline_smoke.sh "$f"; done
      - name: publish when the package set changed
        if: github.ref == 'refs/heads/z2k-enhanced' && github.event_name != 'push'
        run: |
          set -eu
          cat out/aarch64-installer.manifest out/mipsel-installer.manifest out/mips-installer.manifest > out/ALL.manifest
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p prev
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p ALL.manifest -D prev 2>/dev/null || true
            if [ -f prev/ALL.manifest ] && cmp -s prev/ALL.manifest out/ALL.manifest; then
              echo "состав пакетов не изменился — выпуск не нужен"
              exit 0
            fi
          fi
          ver() { awk -F'\t' -v p="$1" '$1 == p { print $2; exit }' out/aarch64-installer.manifest; }
          {
            echo "Офлайн-установщики Entware для Keenetic. Собраны $(date -u +%Y-%m-%d) из официального установщика и пакетов bin.entware.net, каждый пакет сверен по SHA256 из официального индекса и установлен без сети в проверочной среде."
            echo
            echo "Ставятся так же, как официальный установщик: архив своей архитектуры кладётся в папку install на USB-накопителе. Инструкция — в README репозитория, раздел «Если Entware не устанавливается»."
            echo
            echo "| Архитектура | Файл |"
            echo "|---|---|"
            echo "| ARM64 (aarch64) | aarch64-installer.tar.gz |"
            echo "| MIPSel | mipsel-installer.tar.gz |"
            echo "| MIPS | mips-installer.tar.gz |"
            echo
            echo "Внутри: busybox $(ver busybox), opkg $(ver opkg), dropbear $(ver dropbear), curl $(ver curl). Полный состав — файлы *.manifest, правка официального скрипта установки — *.install.diff."
            echo
            echo "SHA256:"
            echo '```'
            (cd out && sha256sum ./*-installer.tar.gz)
            echo '```'
          } > out/notes.md
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target z2k-enhanced \
              --title "Entware: офлайн-установщики для Keenetic" --notes-file out/notes.md --latest=false
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            out/*-installer.tar.gz out/*-installer.manifest out/*.install.diff out/ALL.manifest
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file out/notes.md
