# z2k: то, что раньше отдавал caddy. Подключается из http {} основного
# nginx.conf. Раскатывается ТОЛЬКО после остановки caddy — порты 8088 и 80
# до этого заняты им (план 3 v2, шаг 8).
server {
    listen 8088;
    listen [::]:8088;
    access_log off;
    location / { return 404 "z2k\n"; }
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log off;
    # Зеркало Entware для ручной подготовки роутера (README, «Если opkg update
    # висит»): busybox wget в Entware не умеет https, поэтому — простой http.
    # Ходит ТОЛЬКО на bin.entware.net, методы — GET/HEAD, без логинов.
    # 11.10.2026. return 404 — внутри location /: на уровне сервера он
    # срабатывал бы раньше выбора location и закрыл бы и зеркало.
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;
    location /entware/ {
        limit_except GET HEAD { deny all; }
        set $z2k_entware bin.entware.net;
        rewrite ^/entware/(.*)$ /$1 break;
        proxy_pass http://$z2k_entware;
        proxy_set_header Host bin.entware.net;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location / {
        return 404;
    }
}
